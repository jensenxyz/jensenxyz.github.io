<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F4"/>
      <stop offset="100%" stop-color="#E8E2DE"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Packaging Blueprint Grid -->
  <g opacity="0.12" stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Technical Die-Line & Blueprint Board -->
  <g transform="translate(90, 50)" filter="url(#shadow3)">
    <!-- Board Base -->
    <rect width="620" height="400" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Header Title Bar -->
    <rect width="620" height="44" rx="16" fill="#0F172A"/>
    <text x="24" y="27" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">SPECIFICATION SHEET: PACKAGING INTEGRATION &amp; DIE-LINE</text>
    <rect x="510" y="12" width="86" height="20" rx="10" fill="#334155"/>
    <text x="522" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">REV 4.2 • OK</text>

    <!-- Packaging Die-Cut Box Outline (Isometric/Orthographic Flattened Fold Lines) -->
    <g transform="translate(40, 75)">
      <!-- Main Face -->
      <rect x="120" y="40" width="160" height="180" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
      <text x="140" y="70" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#0284C7">FRONT PANEL</text>
      <text x="140" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Luxury Spirits / FMCG</text>

      <!-- Flaps & Folds (dashed) -->
      <rect x="40" y="40" width="80" height="180" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="280" y="40" width="80" height="180" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="120" y="0" width="160" height="40" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="120" y="220" width="160" height="40" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Secure QR Code Placement Zone with Quiet Zone Markings -->
      <g transform="translate(160, 110)">
        <!-- Safe Margin / Quiet Zone -->
        <rect x="-10" y="-10" width="100" height="100" fill="#FEF3C7" fill-opacity="0.6" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="-8" y="-14" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#D97706">QUIET ZONE &gt;= 4MM</text>
        
        <!-- Secure QR Silhouette -->
        <rect x="0" y="0" width="80" height="80" fill="#0F172A" rx="4"/>
        <g fill="#FFFFFF">
          <rect x="6" y="6" width="22" height="22" rx="2"/>
          <rect x="10" y="10" width="14" height="14" rx="1" fill="#0F172A"/>
          <rect x="52" y="6" width="22" height="22" rx="2"/>
          <rect x="56" y="10" width="14" height="14" rx="1" fill="#0F172A"/>
          <rect x="6" y="52" width="22" height="22" rx="2"/>
          <rect x="10" y="56" width="14" height="14" rx="1" fill="#0F172A"/>
          <!-- Central Secure Code Markings -->
          <circle cx="40" cy="40" r="12" fill="#F59E0B"/>
        </g>

        <!-- Dimension Arrows -->
        <line x1="0" y1="92" x2="80" y2="92" stroke="#EF4444" stroke-width="1.5"/>
        <polygon points="0,92 5,89 5,95" fill="#EF4444"/>
        <polygon points="80,92 75,89 75,95" fill="#EF4444"/>
        <text x="24" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#EF4444">18 x 18 mm</text>
      </g>
    </g>

    <!-- Technical Parameter Callouts on the Right Side -->
    <g transform="translate(420, 68)">
      <!-- Callout 1 -->
      <rect width="170" height="66" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0F172A">SUBSTRATE ADVICE</text>
      <text x="14" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Coated Paperboard, Foil,</text>
      <text x="14" y="50" font-family="'Inter', sans-serif" font-size="9" fill="#475569">&amp; Holographic Laminates</text>

      <!-- Callout 2 -->
      <g transform="translate(0, 76)">
        <rect width="170" height="66" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0F172A">MIN PRINT CONTRAST</text>
        <text x="14" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#475569">K-Ink Density &gt; 1.40 D</text>
        <rect x="14" y="44" width="140" height="8" rx="4" fill="#E2E8F0"/>
        <rect x="14" y="44" width="125" height="8" rx="4" fill="#0284C7"/>
      </g>

      <!-- Callout 3 -->
      <g transform="translate(0, 152)">
        <rect width="170" height="86" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
        <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#166534">CLIENT CONSULTING</text>
        <text x="14" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#15803D">Custom packaging audits,</text>
        <text x="14" y="50" font-family="'Inter', sans-serif" font-size="9" fill="#15803D">print line trial validation,</text>
        <text x="14" y="64" font-family="'Inter', sans-serif" font-size="9" fill="#15803D">&amp; brand design harmony</text>
      </g>
    </g>
  </g>
</svg>
