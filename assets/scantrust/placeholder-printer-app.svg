<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F3"/>
      <stop offset="100%" stop-color="#EDE4E0"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Subtle Manufacturing Grid -->
  <g opacity="0.15" stroke="#000000" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Industrial Printer App Console Window -->
  <g transform="translate(100, 50)" filter="url(#shadow2)">
    <!-- Main Window Container -->
    <rect width="600" height="400" rx="20" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="2"/>

    <!-- App Window Header Bar -->
    <path d="M 0 20 Q 0 0 20 0 L 580 0 Q 600 0 600 20 L 600 48 L 0 48 Z" fill="url(#headerGrad)"/>
    <circle cx="24" cy="24" r="5" fill="#EF4444"/>
    <circle cx="40" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="24" r="5" fill="#10B981"/>
    <text x="82" y="28" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#F4F4F5">Scantrust Printer Calibration &amp; QC Suite v2.4</text>
    <rect x="475" y="14" width="105" height="20" rx="10" fill="#22C55E" fill-opacity="0.2"/>
    <circle cx="487" cy="24" r="3.5" fill="#22C55E"/>
    <text x="497" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#4ADE80">HP Indigo 6900</text>

    <!-- Sidebar Menu -->
    <rect x="0" y="48" width="150" height="352" fill="#F4F4F5"/>
    <g transform="translate(16, 70)">
      <rect x="0" y="0" width="118" height="34" rx="8" fill="#18181B"/>
      <text x="34" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Calibration</text>
      <circle cx="18" cy="17" r="4" fill="#6366F1"/>

      <rect x="0" y="44" width="118" height="34" rx="8" fill="transparent"/>
      <text x="34" y="66" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#52525B">Print Orders</text>
      <circle cx="18" cy="61" r="4" fill="#A1A1AA"/>

      <rect x="0" y="88" width="118" height="34" rx="8" fill="transparent"/>
      <text x="34" y="110" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#52525B">Quality Audit</text>
      <circle cx="18" cy="105" r="4" fill="#A1A1AA"/>

      <rect x="0" y="132" width="118" height="34" rx="8" fill="transparent"/>
      <text x="34" y="154" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#52525B">Ink Tolerances</text>
      <circle cx="18" cy="149" r="4" fill="#A1A1AA"/>
    </g>

    <!-- Content Workspace -->
    <g transform="translate(170, 68)">
      <!-- Panel 1: Live QC Dot Matrix Inspection -->
      <rect width="240" height="180" rx="12" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#18181B">Dot Gain &amp; Dot Loss Analysis</text>
      
      <!-- Magnified QR Matrix Inspection Target -->
      <g transform="translate(20, 42)">
        <rect width="80" height="80" rx="6" fill="#18181B"/>
        <!-- Dot Grid -->
        <g fill="#818CF8">
          <circle cx="20" cy="20" r="6"/>
          <circle cx="40" cy="20" r="5"/>
          <circle cx="60" cy="20" r="6"/>
          <circle cx="20" cy="40" r="5"/>
          <circle cx="40" cy="40" r="7" fill="#6366F1"/>
          <circle cx="60" cy="40" r="5"/>
          <circle cx="20" cy="60" r="6"/>
          <circle cx="40" cy="60" r="5"/>
          <circle cx="60" cy="60" r="6"/>
        </g>
        <circle cx="40" cy="40" r="14" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="3,3"/>
      </g>

      <g transform="translate(115, 48)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#71717A">Optical Resolution</text>
        <text x="0" y="30" font-family="'Montserrat', sans-serif" font-size="15" font-weight="800" fill="#18181B">1200 DPI</text>

        <text x="0" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#71717A">Matrix Grade</text>
        <rect x="0" y="58" width="54" height="20" rx="4" fill="#DCFCE7"/>
        <text x="8" y="72" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#166534">GRADE A</text>
      </g>

      <!-- Micro Progress Bar -->
      <rect x="16" y="142" width="208" height="6" rx="3" fill="#E4E4E7"/>
      <rect x="16" y="142" width="185" height="6" rx="3" fill="#22C55E"/>
      <text x="16" y="162" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#16A34A">Print Calibration: 98.4% Matched</text>

      <!-- Panel 2: Live Print Queue Batch -->
      <g transform="translate(255, 0)">
        <rect width="155" height="180" rx="12" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.5"/>
        <text x="14" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#18181B">Active Job Queue</text>
        
        <g transform="translate(14, 40)">
          <rect width="127" height="36" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
          <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#18181B">Batch #4802</text>
          <text x="10" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#71717A">250,000 labels</text>
          <circle cx="112" cy="18" r="4" fill="#22C55E"/>
        </g>

        <g transform="translate(14, 84)">
          <rect width="127" height="36" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
          <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#18181B">Batch #4803</text>
          <text x="10" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#71717A">500,000 labels</text>
          <circle cx="112" cy="18" r="4" fill="#F59E0B"/>
        </g>

        <g transform="translate(14, 128)">
          <rect width="127" height="36" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
          <text x="10" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#18181B">Batch #4804</text>
          <text x="10" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#71717A">100,000 labels</text>
          <circle cx="112" cy="18" r="4" fill="#94A3B8"/>
        </g>
      </g>

      <!-- Bottom Panel: Production Status -->
      <g transform="translate(0, 195)">
        <rect width="410" height="115" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="16" y="24" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#18181B">Quality Control Metrics Across 10 Presses</text>
        
        <!-- Bars -->
        <g transform="translate(20, 42)">
          <!-- Bar 1 -->
          <rect x="0" y="20" width="22" height="40" rx="3" fill="#3B82F6"/>
          <text x="3" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">P1</text>
          <!-- Bar 2 -->
          <rect x="36" y="10" width="22" height="50" rx="3" fill="#3B82F6"/>
          <text x="39" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">P2</text>
          <!-- Bar 3 -->
          <rect x="72" y="5" width="22" height="55" rx="3" fill="#10B981"/>
          <text x="75" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">P3</text>
          <!-- Bar 4 -->
          <rect x="108" y="15" width="22" height="45" rx="3" fill="#3B82F6"/>
          <text x="111" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">P4</text>
          <!-- Bar 5 -->
          <rect x="144" y="8" width="22" height="52" rx="3" fill="#10B981"/>
          <text x="147" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">P5</text>
        </g>

        <g transform="translate(210, 44)">
          <rect width="180" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
          <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">Live Production Status</text>
          <text x="14" y="38" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#0F172A">Zero QC Deviations</text>
        </g>
      </g>
    </g>
  </g>
</svg>
