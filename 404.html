<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Lost? | JENSEN</title>
    <meta name="robots" content="noindex">

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="JENSEN">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet (absolute path: this page is served at any missing URL) -->
    <link rel="stylesheet" href="/style.css">

    <style>
        .lost {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 48px 20px;
            text-align: center;
        }

        .lost-photo {
            width: 100%;
            max-width: 440px;
            height: auto;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: var(--border-radius);
            display: block;
        }

        .lost-copy {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .lost-copy p {
            margin: 0;
        }

        .lost-copy .lost-hey {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.6rem;
            line-height: 1.1;
            margin-bottom: 14px;
        }

        .lost-copy .lost-home {
            margin-top: 14px;
            font-weight: 600;
        }

        .lost-copy .lost-home a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 2px;
        }

        @media (max-width: 768px) {
            .lost-copy { font-size: 1.1rem; }
            .lost-copy .lost-hey { font-size: 2.2rem; }
        }
    </style>
</head>
<body class="bg-beige">

    <main class="lost">
        <img class="lost-photo" src="/assets/404-lost-in-the-snow.webp" width="1000" height="751" alt="Jensen in a ski helmet and orange goggles on a snowy mountain slope">

        <div class="lost-copy">
            <p class="lost-hey">Hey!</p>
            <p>It seems you’re lost in my website.</p>
            <p>Don’t worry.</p>
            <p class="lost-home"><a href="/">Home is here.</a></p>
        </div>
    </main>

</body>
</html>
