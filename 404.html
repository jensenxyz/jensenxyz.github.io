    <!-- Stylesheet (absolute path: this page is served at any missing URL) -->
    <link rel="stylesheet" href="/style.css">

    <style>
        .notfound-hub {
            min-height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .notfound-card {
            background-color: var(--bg-white);
            padding: 44px 30px 40px;
            border-radius: 28px;
            border: 1px solid #e6e0d9;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
        }

        .notfound-code {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4.5rem;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--text-dark);
            margin-bottom: 14px;
        }

        .notfound-card h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .notfound-card p {
            color: var(--text-grey);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-wide {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            font-size: 1rem;
            border-radius: 14px;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid #cfc7c0;
        }

        .btn-outline:hover {
            border-color: var(--text-dark);
            background-color: #f7f4ef;
        }
    </style>
</head>
<body class="bg-beige">

    <!-- Header Navigation (Sticky & Translucent) -->
    <header class="site-header">
        <div class="container header-flex">
            <a href="/" class="logo">JENSEN ✨</a>

                Back to Home

    <main class="notfound-hub">

            <div class="action-list">
                <a href="/" class="btn btn-black btn-wide">Back to Home</a>
                <a href="/research" class="btn btn-outline btn-wide">Research</a>
                <a href="/cv" class="btn btn-outline btn-wide">CV</a>
            </div>
        </div>
    </main>

    <!-- Footer -->

                <a href="/">Home</a>
                <a href="/research">Research</a>

            </div>
            <div class="footer-copy">
                Made with ♥️ & AI on Earth © JENSEN S.Z. <span class="footer-rainbow" role="button" tabindex="0" title="Make it rain rainbows! 🌈" aria-label="Make it rain rainbows">🌈</span>✨
            </div>
        </div>
    </footer>
